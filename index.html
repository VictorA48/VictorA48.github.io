<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTV - Televisión Digital Oficial</title>
  
  <!-- HLS.js para transmisión en vivo -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- FontAwesome e Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080b11;
      --card-bg: rgba(22, 27, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.35);
      --accent: #4facfe;
      --live-red: #ff2a5f;
      --live-glow: rgba(255, 42, 95, 0.5);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* HEADER MODERNO CON LOGO LIMPIO Y NORMAL */
    header {
      width: 100%;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 44px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      filter: none; /* Sin brillo ni sombras, totalmente natural */
      border-radius: 0;
      display: block;
    }

    .logo-fallback {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #080b11;
      font-weight: 800;
      font-size: 24px;
      padding: 4px 16px;
      border-radius: 10px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px var(--primary-glow);
      display: none;
    }

    .channel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .widget-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .clock-widget i { color: var(--primary); }
    .clock-widget .clock-date { color: var(--text-muted); text-transform: capitalize; }
    .clock-widget .clock-time { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--primary); }

    .weather-widget-header { color: #fff; font-weight: 600; }

    .visitor-counter i { color: var(--accent); }
    .visitor-counter { color: #fff; font-weight: 600; }

    .live-indicator {
      background: rgba(255, 42, 95, 0.12);
      border: 1px solid var(--live-red);
      color: #ff5e82;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--live-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--live-red);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* ANIMACIONES REALISTAS DEL CLIMA */
    .animated-weather-icon {
      width: 36px;
      height: 36px;
      display: inline-block;
      vertical-align: middle;
      overflow: visible;
    }

    .animated-sun-rays {
      transform-origin: 32px 32px;
      animation: rotateRays 14s linear infinite;
    }

    .animated-sun-core {
      transform-origin: 32px 32px;
      animation: pulseSun 3s ease-in-out infinite alternate;
    }

    .animated-cloud-back {
      animation: floatCloudBack 4s ease-in-out infinite alternate;
    }

    .animated-cloud-front {
      animation: floatCloudFront 3s ease-in-out infinite alternate;
    }

    .animated-lightning {
      animation: flashLightning 2.5s ease-in-out infinite;
    }

    .animated-rain-1 { animation: dropRain 1s linear infinite; }
    .animated-rain-2 { animation: dropRain 1.2s linear infinite 0.3s; }
    .animated-rain-3 { animation: dropRain 0.9s linear infinite 0.6s; }

    @keyframes rotateRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseSun {
      0% { transform: scale(0.96); filter: drop-shadow(0 0 2px #ffb703); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 6px #ffb703); }
    }

    @keyframes floatCloudBack {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-3px, 2px); }
    }

    @keyframes floatCloudFront {
      0% { transform: translate(0, 0); }
      100% { transform: translate(4px, -2px); }
    }

    @keyframes flashLightning {
      0%, 90%, 100% { opacity: 0; }
      92%, 96% { opacity: 1; filter: drop-shadow(0 0 6px #ffe600); }
    }

    @keyframes dropRain {
      0% { transform: translateY(-3px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0; }
    }

    /* CONTENEDOR PRINCIPAL */
    .main-container {
      width: 92%;
      max-width: 1200px;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* REPRODUCTOR DE VIDEO */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.1);
      border: 1px solid var(--card-border);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      object-fit: contain;
    }

    .player-error {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 11, 17, 0.92);
      color: var(--text-muted);
      gap: 10px;
      z-index: 10;
      display: none;
      text-align: center;
      padding: 20px;
    }

    .player-error i { font-size: 36px; color: var(--live-red); }

    /* BARRA DE ACCIONES Y REDES */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 16px;
      gap: 16px;
      border: 1px solid var(--card-border);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #fff;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-fb { background: linear-gradient(135deg, #1877f2, #0052c4); }
    .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); }
    .btn-yt { background: linear-gradient(135deg, #ff0000, #b30000); }
    .btn-blog { background: linear-gradient(135deg, #ff5722, #e64a19); }

    .btn-fullscreen {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #080b11;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13
