<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTV - Televisión Digital Oficial</title>
  
  <!-- HLS.js para transmisión en vivo -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- FontAwesome e Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080b11;
      --card-bg: rgba(22, 27, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.35);
      --accent: #4facfe;
      --live-red: #ff2a5f;
      --live-glow: rgba(255, 42, 95, 0.5);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* HEADER MODERNO */
    header {
      width: 100%;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #080b11;
      font-weight: 800;
      font-size: 26px;
      padding: 4px 18px;
      border-radius: 10px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .channel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .widget-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .clock-widget i { color: var(--primary); }
    .clock-widget .clock-date { color: var(--text-muted); text-transform: capitalize; }
    .clock-widget .clock-time { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--primary); }

    .visitor-counter i { color: var(--accent); }
    .visitor-counter { color: #fff; font-weight: 600; }

    .live-indicator {
      background: rgba(255, 42, 95, 0.12);
      border: 1px solid var(--live-red);
      color: #ff5e82;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--live-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--live-red);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* CONTENEDOR PRINCIPAL */
    .main-container {
      width: 92%;
      max-width: 1200px;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* REPRODUCTOR DE VIDEO */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.1);
      border: 1px solid var(--card-border);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      object-fit: contain;
    }

    .player-error {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 11, 17, 0.92);
      color: var(--text-muted);
      gap: 10px;
      z-index: 10;
      display: none;
      text-align: center;
      padding: 20px;
    }

    .player-error i { font-size: 36px; color: var(--live-red); }

    /* BARRA DE ACCIONES Y REDES */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 16px;
      gap: 16px;
      border: 1px solid var(--card-border);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #fff;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-fb { background: linear-gradient(135deg, #1877f2, #0052c4); }
    .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); }
    .btn-yt { background: linear-gradient(135deg, #ff0000, #b30000); }
    .btn-blog { background: linear-gradient(135deg, #ff5722, #e64a19); }

    .btn-fullscreen {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #080b11;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .btn-fullscreen:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
    }

    /* SECCIÓN PROGRAMACIÓN */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title i { color: var(--primary); }

    .tabs-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.15));
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    /* GRILLA Y TARJETAS DE PROGRAMACIÓN */
    .schedule-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .schedule-card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 16px 22px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      gap: 20px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .schedule-card:hover {
      transform: translateX(4px);
      border-color: rgba(0, 242, 254, 0.3);
      background: rgba(30, 38, 54, 0.8);
    }

    .schedule-card.is-live {
      border-color: var(--live-red);
      background: rgba(255, 42, 95, 0.06);
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.15);
    }

    .schedule-card.is-live::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--live-red);
    }

    .schedule-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(0, 242, 254, 0.08);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.2);
      min-width: 95px;
      text-align: center;
      flex-shrink: 0;
    }

    .schedule-card.is-live .schedule-time {
      color: var(--live-red);
      background: rgba(255, 42, 95, 0.1);
      border-color: rgba(255, 42, 95, 0.3);
    }

    .schedule-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
    }

    .schedule-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .show-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-pelicula { background: rgba(147, 51, 234, 0.2); color: #c084fc; border: 1px solid rgba(147, 51, 234, 0.4); }
    .badge-serie { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-religioso { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-animacion { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
    .badge-especial { background: rgba(20, 184, 166, 0.2); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.4); }
    .badge-general { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }

    .live-tag {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: var(--live-red);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      animation: pulse 1.5s infinite;
    }

    .schedule-show-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--live-red), #ff7597);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
      width: 92%;
      max-width: 1200px;
    }

    @media (max-width: 768px) {
      header {
        padding: 12px 16px;
        flex-direction: column;
        gap: 12px;
      }
      .header-status {
        width: 100%;
        justify-content: center;
      }
      .action-bar {
        justify-content: center;
      }
      .schedule-card {
        padding: 14px;
        gap: 12px;
      }
      .schedule-time {
        min-width: 80px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <div class="logo-badge">UTV</div>
      <span class="channel-title">Televisión Digital</span>
    </div>
    
    <div class="header-status">
      <div class="widget-pill clock-widget">
        <i class="fas fa-clock"></i>
        <span class="clock-date" id="relojFecha">Cargando...</span>
        <span class="clock-time" id="relojHora">--:--:--</span>
      </div>
      
      <div class="widget-pill visitor-counter">
        <i class="fas fa-eye"></i> <span id="contadorVisitas">1.258 vistas</span>
      </div>
      
      <div class="widget-pill live-indicator">
        <span class="dot"></span> EN VIVO
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-container">

    <!-- REPRODUCTOR -->
    <div class="player-wrapper">
      <div id="playerError" class="player-error">
        <i class="fas fa-exclamation-triangle"></i>
        <span>Señal fuera de línea o cargando transmisión...</span>
      </div>
      <video id="videoPlayer" controls autoplay muted playsinline></video>
    </div>

    <!-- BARRA DE ACCIONES Y REDES -->
    <div class="action-bar">
      <div class="social-links">
        <a href="https://www.facebook.com/profile.php?id=100093553610524" target="_blank" class="social-btn btn-fb">
          <i class="fab fa-facebook-f"></i> Facebook
        </a>
        <a href="https://www.instagram.com/victordaniel1282/" target="_blank" class="social-btn btn-ig">
          <i class="fab fa-instagram"></i> Instagram
        </a>
        <a href="https://wa.me/message/MYUB7W3PT6U2H1" target="_blank" class="social-btn btn-wa">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://www.youtube.com/@VictorAg%C3%BCero-Dj-Operador" target="_blank" class="social-btn btn-yt">
          <i class="fab fa-youtube"></i> YouTube
        </a>
        <a href="https://ultradanceonlineparaguay.blogspot.com/" target="_blank" class="social-btn btn-blog">
          <i class="fas fa-blog"></i> Blog
        </a>
      </div>

      <button class="btn-fullscreen" onclick="togglePantallaCompleta()">
        <i class="fas fa-expand"></i> Pantalla Completa
      </button>
    </div>

    <!-- SECCIÓN PROGRAMACIÓN -->
    <div>
      <div class="section-header">
        <div class="section-title">
          <i class="fas fa-tv"></i> Guía de Programación
        </div>
        
        <div class="tabs-container">
          <button class="tab-btn active" id="btnSabado10" onclick="mostrarDia('sabado10')">
            <i class="fas fa-calendar-day"></i> Sábado, 10 Octubre 2026
          </button>
          <button class="tab-btn" id="btnDomingo11" onclick="mostrarDia('domingo11')">
            <i class="fas fa-calendar-day"></i> Domingo, 11 Octubre 2026
          </button>
        </div>
      </div>

      <!-- GRILLA DE PROGRAMACIÓN -->
      <div class="schedule-grid" id="grillaProgramacion"></div>
    </div>

    <footer>
      &copy; 2026 - 2032 UTV - Televisión Digital Oficial. Todos los derechos reservados.
    </footer>
  </div>

  <script>
    const streamURL = "https://eu1.servers10.com:8081/8146/index.m3u8";
    const video = document.getElementById("videoPlayer");
    const errorDiv = document.getElementById("playerError");

    const programacionSabado10 = [
      { hora: "12:00", fin: "13:09", titulo: "Los Tres Chiflados", categoria: "animacion" },
      { hora: "13:09", fin: "14:16", titulo: "Los Thundercats", categoria: "animacion" },
      { hora: "14:16", fin: "15:57", titulo: "Película : Todopoderoso", categoria: "pelicula" },
      { hora: "15:57", fin: "17:23", titulo: "Especial Concert : Talk Talk", categoria: "especial" },
      { hora: "17:23", fin: "18:01", titulo: 'Santo Rosario "Misterios Gozosos"', categoria: "religioso" },
      { hora: "18:01", fin: "19:09", titulo: 'Series Temporada 1 : Hanna Montana', categoria: "serie" },
      { hora: "19:09", fin: "20:55", titulo: 'Película : La Barbería 2 "Vuelta al Negocio"', categoria: "pelicula" },
      { hora: "20:55", fin: "23:59", titulo: "Fin de la Transmisión", categoria: "general" }
    ];

    const programacionDomingo11 = [
      { hora: "12:00", fin: "13:14", titulo: "Dragon Ball", categoria: "animacion" },
      { hora: "13:14", fin: "14:20", titulo: "Mazinger Z", categoria: "animacion" },
      { hora: "14:20", fin: "15:47", titulo: "Película : Los Cuatro Jinetes Del Apocalipsis", categoria: "pelicula" },
      { hora: "15:47", fin: "16:54", titulo: "Especial : The 90s Festival", categoria: "especial" },
      { hora: "16:54", fin: "17:40", titulo: "Santa Misa", categoria: "religioso" },
      { hora: "17:40", fin: "18:13", titulo: 'Santo Rosario "Misterios Gloriosos"', categoria: "religioso" },
      { hora: "18:13", fin: "19:21", titulo: 'Series Temporada 1 : Hannah Montana', categoria: "serie" },
      { hora: "19:21", fin: "20:42", titulo: "Película Paraguaya : Morgue", categoria: "pelicula" },
      { hora: "20:42", fin: "22:28", titulo: "Película : La Isla Maldita", categoria: "pelicula" },
      { hora: "22:28", fin: "23:59", titulo: "Fin de la Transmisión", categoria: "general" }
    ];

    let diaActualCargado = 'sabado10';

    function obtenerMinutos(horaStr) {
      if (!horaStr) return 0;
      const partes = horaStr.split(':');
      return (parseInt(partes[0], 10) || 0) * 60 + (parseInt(partes[1], 10) || 0);
    }

    function obtenerBadgeCategoria(cat) {
      const mapas = {
        pelicula: '<span class="show-badge badge-pelicula"><i class="fas fa-film"></i> Película</span>',
        serie: '<span class="show-badge badge-serie"><i class="fas fa-tv"></i> Serie</span>',
        religioso: '<span class="show-badge badge-religioso"><i class="fas fa-church"></i> Religioso</span>',
        animacion: '<span class="show-badge badge-animacion"><i class="fas fa-child"></i> Animación</span>',
        especial: '<span class="show-badge badge-especial"><i class="fas fa-star"></i> Especial</span>',
        general: '<span class="show-badge badge-general"><i class="fas fa-broadcast-tower"></i> Emisión</span>'
      };
      return mapas[cat] || mapas.general;
    }

    function mostrarDia(dia) {
      diaActualCargado = dia;
      const grillaContainer = document.getElementById("grillaProgramacion");
      if (!grillaContainer) return;

      const btnSabado = document.getElementById("btnSabado10");
      const btnDomingo = document.getElementById("btnDomingo11");

      if (btnSabado) btnSabado.classList.remove("active");
      if (btnDomingo) btnDomingo.classList.remove("active");

      let lista = programacionSabado10;
      if (dia === 'domingo11') {
        lista = programacionDomingo11;
        if (btnDomingo) btnDomingo.classList.add("active");
      } else {
        if (btnSabado) btnSabado.classList.add("active");
      }

      const ahora = new Date();
      const horaMinutosActual = ahora.getHours() * 60 + ahora.getMinutes();

      let html = "";
      lista.forEach(item => {
        const minInicio = obtenerMinutos(item.hora);
        const minFin = obtenerMinutos(item.fin);
        const esEnVivo = horaMinutosActual >= minInicio && horaMinutosActual < minFin;
        
        let porcentajeProgreso = 0;
        if (esEnVivo && minFin > minInicio) {
          porcentajeProgreso = Math.min(100, Math.max(0, ((horaMinutosActual - minInicio) / (minFin - minInicio)) * 100));
        }

        html += `
          <div class="schedule-card ${esEnVivo ? 'is-live' : ''}">
            <div class="schedule-time"><i class="far fa-clock"></i> ${item.hora}</div>
            <div class="schedule-details">
              <div class="schedule-header-row">
                ${obtenerBadgeCategoria(item.categoria)}
                ${esEnVivo ? '<span class="live-tag"><i class="fas fa-play"></i> EN AIRE AHORA</span>' : ''}
              </div>
              <div class="schedule-show-title">${item.titulo}</div>
              ${esEnVivo ? `
                <div class="progress-bar-container">
                  <div class="progress-bar-fill" style="width: ${porcentajeProgreso}%"></div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      grillaContainer.innerHTML = html;
    }

    // Inicializar Reproductor HLS
    function iniciarReproductor() {
      if (Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamURL);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          if (errorDiv) errorDiv.style.display = "none";
          video.play().catch(() => { video.muted = true; video.play(); });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal && errorDiv) {
            errorDiv.style.display = "flex";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = streamURL;
        video.addEventListener("loadedmetadata", function () {
          if (errorDiv) errorDiv.style.display = "none";
          video.play().catch(() => { video.muted = true; video.play(); });
        });
        video.addEventListener("error", function () {
          if (errorDiv) errorDiv.style.display = "flex";
        });
      }
    }

    function togglePantallaCompleta() {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Reloj ajustado
    function actualizarReloj() {
      const ahora = new Date();
      try {
        const opcionesFecha = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
        let fechaTexto = ahora.toLocaleDateString("es-ES", opcionesFecha).replace(/\bde\b/g, "").replace(/\s+/g, " ");
        fechaTexto = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
        
        let horaTexto = ahora.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });

        const elFecha = document.getElementById("relojFecha");
        const elHora = document.getElementById("relojHora");
        if (elFecha) elFecha.textContent = fechaTexto;
        if (elHora) elHora.textContent = horaTexto;
      } catch (e) {
        const elFecha = document.getElementById("relojFecha");
        const elHora = document.getElementById("relojHora");
        if (elFecha) elFecha.textContent = "Sábado, 10 Octubre 2026";
        if (elHora) elHora.textContent = ahora.toLocaleTimeString();
      }
    }

    // Contador de visitas dinámico y continuo
    function cargarVisitas() {
      const contadorEl = document.getElementById("contadorVisitas");
      if (!contadorEl) return;

      let visitas = parseInt(localStorage.getItem("utv_visitas_totales") || "1258", 10);

      if (!sessionStorage.getItem("utv_sesion_contada")) {
        visitas += 1;
        localStorage.setItem("utv_visitas_totales", visitas);
        sessionStorage.setItem("utv_sesion_contada", "true");
      }

      contadorEl.textContent = visitas.toLocaleString("es-PY") + " vistas";

      fetch("https://api.counterapi.dev/v1/utv_oficial_paraguay/vistas/up")
        .then(res => res.json())
        .then(data => {
          if (data && typeof data.count === "number" && data.count > visitas) {
            visitas = data.count;
            localStorage.setItem("utv_visitas_totales", visitas);
            contadorEl.textContent = visitas.toLocaleString("es-PY") + " vistas";
          }
        })
        .catch(() => {});
    }

    // Ejecución inicial
    mostrarDia('sabado10');
    actualizarReloj();
    iniciarReproductor();
    cargarVisitas();

    setInterval(actualizarReloj, 1000);
    setInterval(() => mostrarDia(diaActualCargado), 60000);
  </script>
</body>
</html>
